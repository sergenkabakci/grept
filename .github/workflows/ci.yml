name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Validate npm packaging
        shell: pwsh
        run: |
          npm pack
          $tarball = Get-ChildItem -Filter "grept-*.tgz" | Select-Object -First 1
          Write-Host "Created tarball: $($tarball.Name)"
          $tempDir = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ([Guid]::NewGuid().ToString()))
          Set-Location $tempDir
          npm init -y
          npm install $tarball.FullName
          npx grept --version
          npx grept --help
          "Hello Windows Grept" | npx grept "Grept"
